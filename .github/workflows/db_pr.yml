name: Migrations(PR)

on:
  pull_request:
    branches: ["*"]
  merge_group:

jobs:
  upgrade-then-seed:
    # this job verifies that the migrations behave correctly on an existing but empty database
    name: Upgrade then seed
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      ADMIN_RELATIONS_KEY: ${{ secrets.ADMIN_RELATIONS_KEY }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.merge_group.base_sha }}
          fetch-depth: 0 # need full history for git merge-base

      - name: Rewind to the fork point
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch origin "$PR_REF"
          git checkout "`git merge-base HEAD "$PR_REF"`"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up AdonisJS environment
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run existing AdonisJS migrations
        run: node ace migration:run

      - name: Checkout the PR branch
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: git checkout "$PR_REF"

      - name: Reinstall dependencies
        run: npm ci

      - name: Set up AdonisJS environment (again)
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run new AdonisJS migrations
        run: node ace migration:run

      - name: Seed the database
        run: node ace db:seed

      - name: Tear down the database
        run: node ace migration:rollback --batch=0

  seed-then-upgrade:
    # this job verifies that the migrations behave correctly on an existing database populated with some data
    name: Upgrade a seeded database
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      ADMIN_RELATIONS_KEY: ${{ secrets.ADMIN_RELATIONS_KEY }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.merge_group.base_sha }}
          fetch-depth: 0 # need full history for git merge-base

      - name: Rewind to the fork point
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch origin "$PR_REF"
          git checkout "`git merge-base HEAD "$PR_REF"`"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up AdonisJS environment
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run existing AdonisJS migrations
        run: node ace migration:run

      - name: Seed the database
        run: node ace db:seed

      - name: Checkout the PR branch
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: git checkout "$PR_REF"

      - name: Reinstall dependencies
        run: npm ci

      - name: Set up AdonisJS environment (again)
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run new AdonisJS migrations
        run: node ace migration:run

      - name: Tear down the database
        run: node ace migration:rollback --batch=0

  new-migration-ordering:
    # this job verifies that new migrations are ordered after existing ones
    name: Verify ordering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0 # need full history for diffing

      - name: Fetch the base commit
        run: git fetch origin $REF_TO_FETCH:base-branch
        env:
          REF_TO_FETCH: ${{ github.base_ref || github.event.merge_group.base_sha }}

      - name: Verify new migration order
        run: |
          DIFFED=`git diff --name-only --diff-filter=A --relative=database/migrations base-branch..HEAD database/migrations | sort`
          EXPECTED=$(ls -1 database/migrations | sort | tail -n -`echo "$DIFFED" | wc -l`)
          [[ -z "$DIFFED" ]] && echo "No migrations added" && exit 0 || true
          if ! [[ "$DIFFED" == "$EXPECTED" ]];
          then
            echo "Detected migrations inserted in between existing ones! Please verify that all new migrations sort AFTER all the existing migrations!"
            for file in $DIFFED;
            do
              if ! echo "$EXPECTED" | grep "$file" > /dev/null;
              then
                echo "::error file=database/migrations/$file,line=1::Incorrectly ordered migration file - Rename this file so that it sorts after all existing migrations!";
              fi
            done
            exit 1
          fi

  existing-migration-consistency:
    # this job verifies that existing migrations' behaviour did not change
    name: Verify existing migrations
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Create additional databases
        run: |
          psql postgresql://postgres@localhost <<EOF
          CREATE DATABASE topwr1;
          CREATE DATABASE topwr2;
          EOF

      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.merge_group.base_sha }}
          fetch-depth: 0 # need full history for git merge-base

      - name: Rewind to the fork point
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch origin "$PR_REF"
          git checkout "`git merge-base HEAD "$PR_REF"`"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up AdonisJS environment
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run existing AdonisJS migrations
        run: node ace migration:run
        env:
          DB_DATABASE: topwr1

      - name: Checkout the PR branch, delete new migrations
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          BASE_REF="`git rev-parse HEAD`"
          git checkout "$PR_REF"
          rm -v `git diff --name-only --diff-filter=A $BASE_REF..HEAD database/migrations` || true

      - name: Reinstall dependencies
        run: npm ci

      - name: Set up AdonisJS environment (again)
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run new AdonisJS migrations
        run: node ace migration:run
        env:
          DB_DATABASE: topwr2

      - name: Drop adonis-internal tables and diff the schema
        run: |
          psql postgresql://postgres@localhost <<EOF
          \c topwr1
          DROP TABLE adonis_schema;
          DROP TABLE adonis_schema_versions;
          \c topwr2
          DROP TABLE adonis_schema;
          DROP TABLE adonis_schema_versions;
          EOF
          PG_CONTAINER_ID=`docker container ls --filter ancestor=postgres --format "{{.ID}}"`
          docker exec -e PGPASSWORD $PG_CONTAINER_ID pg_dump --schema-only postgresql://postgres@localhost/topwr1 > topwr1.sql
          docker exec -e PGPASSWORD $PG_CONTAINER_ID pg_dump --schema-only postgresql://postgres@localhost/topwr2 > topwr2.sql
          sed -i -E -e 's/^\\(un)?restrict .+$//' *.sql
          echo "Diffing schemas - any output below means failure!"
          STOP_MARKER=`uuidgen`
          echo "::stop-commands::$STOP_MARKER"
          diff topwr1.sql topwr2.sql || (echo "Detected behaviour changes in existing migrations!" && exit 1)
          echo "::$STOP_MARKER::"

      - name: Upload database dumps
        uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: migration-consistency-db-dumps
          path: "*.sql"

  dry-runs:
    # this job verifies that migrations don't modify the database on dry runs
    name: Verify migrations on dry runs
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.merge_group.base_sha }}
          fetch-depth: 0 # need full history for git merge-base

      - name: Rewind to the fork point
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch origin "$PR_REF"
          git checkout "`git merge-base HEAD "$PR_REF"`"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up AdonisJS environment
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Run existing AdonisJS migrations
        run: node ace migration:run

      - name: Checkout the PR branch
        env:
          PR_REF: ${{ github.event.after || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: git checkout "$PR_REF"

      - name: Reinstall dependencies
        run: npm ci

      - name: Set up AdonisJS environment (again)
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Take a database snapshot
        run: |
          PG_CONTAINER_ID=`docker container ls --filter ancestor=postgres --format "{{.ID}}"`
          docker exec -e PGPASSWORD $PG_CONTAINER_ID pg_dump postgresql://postgres@localhost/postgres > 1-before.sql

      - name: Dry-run new AdonisJS migrations
        run: |
          STOP_MARKER=`uuidgen`
          echo "::stop-commands::$STOP_MARKER"
          node ace migration:run --dry-run
          echo "::$STOP_MARKER::"

      - name: Diff the database
        run: |
          PG_CONTAINER_ID=`docker container ls --filter ancestor=postgres --format "{{.ID}}"`
          docker exec -e PGPASSWORD $PG_CONTAINER_ID pg_dump postgresql://postgres@localhost/postgres > 1-after.sql
          sed -i -E -e 's/^\\(un)?restrict .+$//' *.sql
          echo "Diffing schemas - any output below means failure!"
          STOP_MARKER=`uuidgen`
          echo "::stop-commands::$STOP_MARKER"
          diff 1-before.sql 1-after.sql || (echo "Detected database changes during dry runs!" && exit 1)
          echo "::$STOP_MARKER::"

      - name: Run new AdonisJS migrations (for real this time)
        run: node ace migration:run

      - name: Take a database snapshot
        run: |
          PG_CONTAINER_ID=`docker container ls --filter ancestor=postgres --format "{{.ID}}"`
          docker exec -e PGPASSWORD $PG_CONTAINER_ID pg_dump postgresql://postgres@localhost/postgres > 2-before.sql

      - name: Rollback new migrations as a dry run
        run: |
          STOP_MARKER=`uuidgen`
          echo "::stop-commands::$STOP_MARKER"
          node ace migration:rollback --dry-run
          echo "::$STOP_MARKER::"

      - name: Diff the database
        run: |
          PG_CONTAINER_ID=`docker container ls --filter ancestor=postgres --format "{{.ID}}"`
          docker exec -e PGPASSWORD $PG_CONTAINER_ID pg_dump postgresql://postgres@localhost/postgres > 2-after.sql
          sed -i -E -e 's/^\\(un)?restrict .+$//' *.sql
          echo "Diffing schemas - any output below means failure!"
          STOP_MARKER=`uuidgen`
          echo "::stop-commands::$STOP_MARKER"
          diff 2-before.sql 2-after.sql || (echo "Detected database changes during dry runs!" && exit 1)
          echo "::$STOP_MARKER::"

      - name: Upload database dumps
        uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: dry-runs-db-dumps
          path: "*.sql"
